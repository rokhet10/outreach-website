<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid -->
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Glow -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- CodeReach in cursive -->
  <text
    x="600" y="295"
    font-family="Palatino Linotype, Palatino, Book Antiqua, Georgia, serif"
    font-style="italic"
    font-size="148"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    letter-spacing="-2"
    opacity="0.97"
  >CodeReach</text>

  <!-- Divider line -->
  <line x1="460" y1="330" x2="740" y2="330" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>

  <!-- codereach.org -->
  <text
    x="600" y="390"
    font-family="Palatino Linotype, Palatino, Book Antiqua, Georgia, serif"
    font-style="italic"
    font-size="42"
    fill="rgba(255,255,255,0.78)"
    text-anchor="middle"
    letter-spacing="2"
  >codereach.org</text>

  <!-- Tagline -->
  <text
    x="600" y="460"
    font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif"
    font-size="24"
    fill="rgba(255,255,255,0.45)"
    text-anchor="middle"
    letter-spacing="3"
  >FREE AI &amp; CS EDUCATION</text>
</svg>
