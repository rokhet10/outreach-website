<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f26"/>
      <stop offset="100%" stop-color="#141438"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="rgba(124,58,237,0.25)"/>
      <stop offset="100%" stop-color="rgba(124,58,237,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="rgba(8,145,178,0.18)"/>
      <stop offset="100%" stop-color="rgba(8,145,178,0)"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(139,92,246,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>
  <rect width="1080" height="1920" fill="url(#glow1)"/>
  <rect width="1080" height="1920" fill="url(#glow2)"/>

  <!-- Logo -->
  <text x="540" y="180" font-family="Georgia, serif" font-style="italic" font-size="52" font-weight="700" fill="url(#grad)" text-anchor="middle" letter-spacing="-1">⚡ CodeReach</text>

  <!-- Divider -->
  <line x1="340" y1="220" x2="740" y2="220" stroke="rgba(139,92,246,0.3)" stroke-width="1.5"/>

  <!-- Main text -->
  <text x="540" y="820" font-family="Georgia, serif" font-style="italic" font-size="96" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-2" opacity="0.95">AI is about</text>
  <text x="540" y="940" font-family="Georgia, serif" font-style="italic" font-size="96" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-2" opacity="0.95">to change</text>
  <text x="540" y="1060" font-family="Georgia, serif" font-style="italic" font-size="96" font-weight="700" fill="url(#grad)" text-anchor="middle" letter-spacing="-2">everything</text>
  <text x="540" y="1180" font-family="Georgia, serif" font-style="italic" font-size="96" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-2" opacity="0.95">around you.</text>

  <!-- Sub text -->
  <text x="540" y="1380" font-family="Georgia, serif" font-style="italic" font-size="58" fill="rgba(255,255,255,0.6)" text-anchor="middle">The question is —</text>
  <text x="540" y="1460" font-family="Georgia, serif" font-style="italic" font-size="68" font-weight="700" fill="url(#grad)" text-anchor="middle">are you ready?</text>

  <!-- Bottom tag -->
  <rect x="390" y="1680" width="300" height="56" rx="28" fill="rgba(124,58,237,0.25)" stroke="rgba(124,58,237,0.5)" stroke-width="1.5"/>
  <text x="540" y="1716" font-family="Georgia, serif" font-size="30" fill="rgba(255,255,255,0.75)" text-anchor="middle" letter-spacing="2">codereach.org</text>
</svg>
