<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f26"/>
      <stop offset="100%" stop-color="#141438"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(124,58,237,0.2)"/>
      <stop offset="100%" stop-color="rgba(124,58,237,0)"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(139,92,246,0.06)" stroke-width="1"/>
    </pattern>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(124,58,237,0.15)"/>
      <stop offset="100%" stop-color="rgba(8,145,178,0.08)"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>
  <rect width="1080" height="1920" fill="url(#glow1)"/>

  <!-- Logo -->
  <text x="540" y="180" font-family="Georgia, serif" font-style="italic" font-size="52" font-weight="700" fill="url(#grad)" text-anchor="middle">⚡ CodeReach</text>
  <line x1="340" y1="220" x2="740" y2="220" stroke="rgba(139,92,246,0.3)" stroke-width="1.5"/>

  <!-- Headline -->
  <text x="540" y="420" font-family="Georgia, serif" font-style="italic" font-size="52" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="3">FREE · 6 WEEKS · JUNE 2026</text>
  <text x="540" y="560" font-family="Georgia, serif" font-style="italic" font-size="100" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-2">AI &amp; CS</text>
  <text x="540" y="680" font-family="Georgia, serif" font-style="italic" font-size="100" font-weight="700" fill="url(#grad)" text-anchor="middle" letter-spacing="-2">Summer Camp</text>

  <text x="540" y="790" font-family="Georgia, serif" font-size="42" fill="rgba(255,255,255,0.55)" text-anchor="middle">Zero experience needed.</text>

  <!-- Divider -->
  <line x1="200" y1="850" x2="880" y2="850" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>

  <!-- Info cards -->
  <!-- Card 1 -->
  <rect x="80" y="900" width="440" height="180" rx="20" fill="url(#card-bg)" stroke="rgba(124,58,237,0.35)" stroke-width="1.5"/>
  <text x="300" y="970" font-family="Georgia, serif" font-size="60" text-anchor="middle">📅</text>
  <text x="300" y="1030" font-family="Georgia, serif" font-size="36" fill="rgba(255,255,255,0.5)" text-anchor="middle">Starts</text>
  <text x="300" y="1068" font-family="Georgia, serif" font-size="38" font-weight="700" fill="white" text-anchor="middle">June 2026</text>

  <!-- Card 2 -->
  <rect x="560" y="900" width="440" height="180" rx="20" fill="url(#card-bg)" stroke="rgba(8,145,178,0.35)" stroke-width="1.5"/>
  <text x="780" y="970" font-family="Georgia, serif" font-size="60" text-anchor="middle">📍</text>
  <text x="780" y="1030" font-family="Georgia, serif" font-size="36" fill="rgba(255,255,255,0.5)" text-anchor="middle">Location</text>
  <text x="780" y="1068" font-family="Georgia, serif" font-size="38" font-weight="700" fill="white" text-anchor="middle">Northville, MI</text>

  <!-- Card 3 -->
  <rect x="80" y="1110" width="440" height="180" rx="20" fill="url(#card-bg)" stroke="rgba(124,58,237,0.35)" stroke-width="1.5"/>
  <text x="300" y="1180" font-family="Georgia, serif" font-size="60" text-anchor="middle">⏱️</text>
  <text x="300" y="1240" font-family="Georgia, serif" font-size="36" fill="rgba(255,255,255,0.5)" text-anchor="middle">Commitment</text>
  <text x="300" y="1278" font-family="Georgia, serif" font-size="38" font-weight="700" fill="white" text-anchor="middle">~2 hrs/week</text>

  <!-- Card 4 -->
  <rect x="560" y="1110" width="440" height="180" rx="20" fill="url(#card-bg)" stroke="rgba(8,145,178,0.35)" stroke-width="1.5"/>
  <text x="780" y="1180" font-family="Georgia, serif" font-size="60" text-anchor="middle">💸</text>
  <text x="780" y="1240" font-family="Georgia, serif" font-size="36" fill="rgba(255,255,255,0.5)" text-anchor="middle">Cost</text>
  <text x="780" y="1278" font-family="Georgia, serif" font-size="38" font-weight="700" fill="white" text-anchor="middle">Completely Free</text>

  <!-- Tagline -->
  <text x="540" y="1460" font-family="Georgia, serif" font-style="italic" font-size="44" fill="rgba(255,255,255,0.65)" text-anchor="middle">From "what is code?" to</text>
  <text x="540" y="1520" font-family="Georgia, serif" font-style="italic" font-size="44" fill="rgba(255,255,255,0.65)" text-anchor="middle">a real Python project</text>
  <text x="540" y="1580" font-family="Georgia, serif" font-style="italic" font-size="44" fill="rgba(255,255,255,0.65)" text-anchor="middle">you built yourself.</text>

  <!-- CTA -->
  <rect x="240" y="1680" width="600" height="90" rx="45" fill="url(#grad)"/>
  <text x="540" y="1736" font-family="Georgia, serif" font-size="40" font-weight="700" fill="white" text-anchor="middle">Reserve Your Spot →</text>
  <text x="540" y="1830" font-family="Georgia, serif" font-size="32" fill="rgba(255,255,255,0.45)" text-anchor="middle">Link in bio · codereach.org</text>
</svg>
