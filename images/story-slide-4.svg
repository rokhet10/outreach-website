<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f26"/>
      <stop offset="100%" stop-color="#141438"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="rgba(124,58,237,0.22)"/>
      <stop offset="100%" stop-color="rgba(124,58,237,0)"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(139,92,246,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>
  <rect width="1080" height="1920" fill="url(#glow)"/>

  <!-- Logo -->
  <text x="540" y="180" font-family="Georgia, serif" font-style="italic" font-size="52" font-weight="700" fill="url(#grad)" text-anchor="middle">⚡ CodeReach</text>
  <line x1="340" y1="220" x2="740" y2="220" stroke="rgba(139,92,246,0.3)" stroke-width="1.5"/>

  <!-- Main CTA text -->
  <text x="540" y="560" font-family="Georgia, serif" font-style="italic" font-size="58" fill="rgba(255,255,255,0.55)" text-anchor="middle">Spots are limited.</text>
  <text x="540" y="700" font-family="Georgia, serif" font-style="italic" font-size="100" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-2">Join us</text>
  <text x="540" y="820" font-family="Georgia, serif" font-style="italic" font-size="100" font-weight="700" fill="url(#grad)" text-anchor="middle" letter-spacing="-2">this June.</text>

  <!-- Pill badges -->
  <rect x="130" y="920" width="340" height="70" rx="35" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.45)" stroke-width="1.5"/>
  <text x="300" y="963" font-family="Georgia, serif" font-size="34" fill="white" text-anchor="middle">💸 Free</text>

  <rect x="500" y="920" width="450" height="70" rx="35" fill="rgba(8,145,178,0.15)" stroke="rgba(8,145,178,0.4)" stroke-width="1.5"/>
  <text x="725" y="963" font-family="Georgia, serif" font-size="34" fill="white" text-anchor="middle">📍 Northville, MI</text>

  <rect x="220" y="1015" width="320" height="70" rx="35" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.45)" stroke-width="1.5"/>
  <text x="380" y="1058" font-family="Georgia, serif" font-size="34" fill="white" text-anchor="middle">⏱️ 2 hrs/week</text>

  <rect x="560" y="1015" width="320" height="70" rx="35" fill="rgba(8,145,178,0.15)" stroke="rgba(8,145,178,0.4)" stroke-width="1.5"/>
  <text x="720" y="1058" font-family="Georgia, serif" font-size="34" fill="white" text-anchor="middle">🐍 Python + AI</text>

  <!-- Quote -->
  <line x1="200" y1="1150" x2="880" y2="1150" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
  <text x="540" y="1260" font-family="Georgia, serif" font-style="italic" font-size="50" fill="rgba(255,255,255,0.7)" text-anchor="middle">"No gatekeeping.</text>
  <text x="540" y="1330" font-family="Georgia, serif" font-style="italic" font-size="50" fill="rgba(255,255,255,0.7)" text-anchor="middle">No experience needed.</text>
  <text x="540" y="1420" font-family="Georgia, serif" font-style="italic" font-size="58" font-weight="700" fill="url(#grad)" text-anchor="middle">Just curiosity."</text>
  <line x1="200" y1="1490" x2="880" y2="1490" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>

  <!-- Big CTA button -->
  <rect x="140" y="1560" width="800" height="110" rx="55" fill="url(#grad)"/>
  <text x="540" y="1626" font-family="Georgia, serif" font-size="50" font-weight="700" fill="white" text-anchor="middle">Reserve Your Spot →</text>

  <text x="540" y="1740" font-family="Georgia, serif" font-size="36" fill="rgba(255,255,255,0.5)" text-anchor="middle">codereach.org</text>
  <text x="540" y="1800" font-family="Georgia, serif" font-size="30" fill="rgba(255,255,255,0.3)" text-anchor="middle">Link in bio</text>
</svg>
